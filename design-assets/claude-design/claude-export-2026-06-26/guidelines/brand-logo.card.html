<!-- @dsCard group="Brand" viewport="700x180" name="Logo" subtitle="The SignalThread wordmark + signal waveform" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 0; background: var(--surface-card); font-family: var(--font-sans); }
  .wrap { display: grid; grid-template-columns: 1fr 1fr; height: 180px; }
  .light { background: var(--surface-card); display: flex; align-items: center; justify-content: center; border-right: 1px solid var(--border-subtle); }
  .navy { background: var(--brand-navy); display: flex; align-items: center; justify-content: center; }
  img { width: 78%; max-width: 280px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="light"><img src="../assets/signalthread-logo.png" alt="SignalThread" /></div>
  <div class="navy"><img src="../assets/signalthread-logo.png" alt="SignalThread" style="filter:brightness(0) invert(1); opacity:.96" /></div>
</div>
</body>
</html>
