<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces & text" subtitle="Canvas, card, borders, and the text ramp" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--surface-canvas); font-family: var(--font-sans); }
  .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: stretch; }
  .surfaces { display: flex; gap: 10px; }
  .tile { flex: 1; height: 96px; border-radius: var(--radius-md); display: flex; align-items: flex-end; padding: 8px; font-size: 10px; font-weight: 600; color: var(--text-muted); }
  .txt p { margin: 0 0 5px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="surfaces">
    <div class="tile" style="background:var(--surface-canvas); border:1px solid var(--border-subtle)">canvas #f8f8fb</div>
    <div class="tile" style="background:var(--surface-card); border:1px solid var(--border-subtle)">card #fff</div>
    <div class="tile" style="background:var(--surface-sunken); border:1px solid var(--border-subtle)">sunken</div>
  </div>
  <div class="txt" style="background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-md); padding:12px 14px">
    <p style="font-size:18px; font-weight:700; color:var(--text-strong)">Strong — slate-900</p>
    <p style="font-size:15px; font-weight:600; color:var(--text-heading)">Heading — slate-800</p>
    <p style="font-size:14px; color:var(--text-body)">Body — slate-700</p>
    <p style="font-size:13px; color:var(--text-muted)">Muted — slate-500</p>
    <p style="font-size:12px; color:var(--text-subtle)">Subtle — slate-400</p>
  </div>
</div>
</body>
</html>
