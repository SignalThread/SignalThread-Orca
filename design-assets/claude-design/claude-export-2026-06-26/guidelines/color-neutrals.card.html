<!-- @dsCard group="Colors" viewport="700x150" name="Slate neutrals" subtitle="Text, borders, surfaces — the structural backbone" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); font-family: var(--font-sans); }
  .row { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-subtle); }
  .sw { flex: 1; height: 84px; display: flex; flex-direction: column; justify-content: flex-end; padding: 7px 8px; }
  .n { font-size: 11px; font-weight: 600; }
</style>
</head>
<body>
<div class="row">
  <div class="sw" style="background:var(--slate-50)"><span class="n" style="color:var(--slate-700)">50</span></div>
  <div class="sw" style="background:var(--slate-100)"><span class="n" style="color:var(--slate-700)">100</span></div>
  <div class="sw" style="background:var(--slate-200)"><span class="n" style="color:var(--slate-700)">200</span></div>
  <div class="sw" style="background:var(--slate-300)"><span class="n" style="color:var(--slate-800)">300</span></div>
  <div class="sw" style="background:var(--slate-400)"><span class="n" style="color:#fff">400</span></div>
  <div class="sw" style="background:var(--slate-500)"><span class="n" style="color:#fff">500</span></div>
  <div class="sw" style="background:var(--slate-600)"><span class="n" style="color:#fff">600</span></div>
  <div class="sw" style="background:var(--slate-700)"><span class="n" style="color:#fff">700 ·body</span></div>
  <div class="sw" style="background:var(--slate-800)"><span class="n" style="color:#fff">800</span></div>
  <div class="sw" style="background:var(--slate-900)"><span class="n" style="color:#fff">900</span></div>
</div>
</body>
</html>
