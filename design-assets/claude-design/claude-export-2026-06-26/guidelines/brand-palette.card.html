<!-- @dsCard group="Brand" viewport="700x150" name="Brand palette" subtitle="Navy wordmark, blue→cyan waveform, orange signal pulse" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); font-family: var(--font-sans); }
  .row { display: flex; gap: 14px; }
  .chip { flex: 1; height: 100px; border-radius: var(--radius-md); display: flex; flex-direction: column; justify-content: flex-end; padding: 10px 12px; }
  .n { font-size: 12px; font-weight: 600; color: #fff; }
  .h { font-size: 10px; font-family: var(--font-mono); color: rgba(255,255,255,.85); }
</style>
</head>
<body>
<div class="row">
  <div class="chip" style="background:var(--brand-navy)"><span class="n">Navy</span><span class="h">#183060</span></div>
  <div class="chip" style="background:var(--brand-blue)"><span class="n">Blue</span><span class="h">#3078C0</span></div>
  <div class="chip" style="background:var(--brand-cyan)"><span class="n">Cyan</span><span class="h">#30A8D8</span></div>
  <div class="chip" style="background:var(--brand-orange)"><span class="n">Signal Orange</span><span class="h">#F07830</span></div>
</div>
</body>
</html>
