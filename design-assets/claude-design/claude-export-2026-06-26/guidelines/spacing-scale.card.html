<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base grid — the rhythm of every layout" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px 24px; background: var(--surface-card); font-family: var(--font-sans); }
  .row { display: flex; align-items: flex-end; gap: 18px; }
  .item { text-align: center; }
  .bar { background: var(--primary-200); border-radius: 3px 3px 0 0; width: 100%; }
  .t { font-family: var(--font-mono); font-size: 10px; color: var(--text-subtle); margin-top: 6px; }
</style>
</head>
<body>
<div class="row">
  <div class="item"><div class="bar" style="height:4px;width:24px"></div><div class="t">1·4</div></div>
  <div class="item"><div class="bar" style="height:8px;width:24px"></div><div class="t">2·8</div></div>
  <div class="item"><div class="bar" style="height:12px;width:24px"></div><div class="t">3·12</div></div>
  <div class="item"><div class="bar" style="height:16px;width:24px"></div><div class="t">4·16</div></div>
  <div class="item"><div class="bar" style="height:20px;width:24px"></div><div class="t">5·20</div></div>
  <div class="item"><div class="bar" style="height:24px;width:24px"></div><div class="t">6·24</div></div>
  <div class="item"><div class="bar" style="height:32px;width:24px"></div><div class="t">8·32</div></div>
  <div class="item"><div class="bar" style="height:48px;width:24px"></div><div class="t">12·48</div></div>
  <div class="item"><div class="bar" style="height:64px;width:24px"></div><div class="t">16·64</div></div>
</div>
</body>
</html>
