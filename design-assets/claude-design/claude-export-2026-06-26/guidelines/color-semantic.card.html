<!-- @dsCard group="Colors" viewport="700x160" name="Semantic status" subtitle="success · warning · danger · info · accent role tints" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .col { }
  .name { font-size: 11px; font-weight: 600; color: var(--text-body); margin-bottom: 6px; }
  .ramp { display: flex; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border-subtle); }
  .c { flex: 1; height: 44px; }
  .uses { font-size: 10px; color: var(--text-subtle); margin-top: 6px; }
</style>
</head>
<body>
<div class="grid">
  <div class="col">
    <div class="name">Success</div>
    <div class="ramp"><div class="c" style="background:var(--success-50)"></div><div class="c" style="background:var(--success-200)"></div><div class="c" style="background:var(--success-600)"></div><div class="c" style="background:var(--success-700)"></div></div>
    <div class="uses">Active · Approved</div>
  </div>
  <div class="col">
    <div class="name">Warning</div>
    <div class="ramp"><div class="c" style="background:var(--warning-50)"></div><div class="c" style="background:var(--warning-200)"></div><div class="c" style="background:var(--warning-600)"></div><div class="c" style="background:var(--warning-700)"></div></div>
    <div class="uses">Draft · Needs setup</div>
  </div>
  <div class="col">
    <div class="name">Danger</div>
    <div class="ramp"><div class="c" style="background:var(--danger-50)"></div><div class="c" style="background:var(--danger-200)"></div><div class="c" style="background:var(--danger-600)"></div><div class="c" style="background:var(--danger-700)"></div></div>
    <div class="uses">Rejected · Blocked</div>
  </div>
  <div class="col">
    <div class="name">Info</div>
    <div class="ramp"><div class="c" style="background:var(--info-50)"></div><div class="c" style="background:var(--info-200)"></div><div class="c" style="background:var(--info-600)"></div><div class="c" style="background:var(--info-700)"></div></div>
    <div class="uses">Scheduled · ADMIN</div>
  </div>
  <div class="col">
    <div class="name">Accent</div>
    <div class="ramp"><div class="c" style="background:var(--violet-50)"></div><div class="c" style="background:var(--violet-200)"></div><div class="c" style="background:var(--violet-600)"></div><div class="c" style="background:var(--violet-700)"></div></div>
    <div class="uses">SUPER ADMIN · OWNER</div>
  </div>
</div>
</body>
</html>
