<!-- @dsCard group="Colors" viewport="700x150" name="Primary action" subtitle="Deep indigo-blue — buttons, active nav, links (#28439A)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); font-family: var(--font-sans); }
  .row { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-subtle); }
  .sw { flex: 1; height: 84px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 10px; }
  .n { font-size: 11px; font-weight: 600; }
  .h { font-size: 10px; opacity: .85; font-family: var(--font-mono); }
</style>
</head>
<body>
<div class="row">
  <div class="sw" style="background:var(--primary-50)"><span class="n" style="color:var(--primary-800)">50</span><span class="h" style="color:var(--primary-700)">#EEF2FB</span></div>
  <div class="sw" style="background:var(--primary-100)"><span class="n" style="color:var(--primary-800)">100</span><span class="h" style="color:var(--primary-700)">#DBE3F6</span></div>
  <div class="sw" style="background:var(--primary-200)"><span class="n" style="color:var(--primary-900)">200</span><span class="h" style="color:var(--primary-800)">#B7C5EC</span></div>
  <div class="sw" style="background:var(--primary-500)"><span class="n" style="color:#fff">500</span><span class="h" style="color:#fff">#3551AB</span></div>
  <div class="sw" style="background:var(--primary-600)"><span class="n" style="color:#fff">600 ·base</span><span class="h" style="color:#fff">#28439A</span></div>
  <div class="sw" style="background:var(--primary-700)"><span class="n" style="color:#fff">700 ·hover</span><span class="h" style="color:#fff">#243D8E</span></div>
  <div class="sw" style="background:var(--primary-800)"><span class="n" style="color:#fff">800 ·link</span><span class="h" style="color:#fff">#1F3D8F</span></div>
  <div class="sw" style="background:var(--primary-900)"><span class="n" style="color:#fff">900</span><span class="h" style="color:#fff">#182F6B</span></div>
</div>
</body>
</html>
