<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 22px; background: var(--surface-canvas); }
  .label { font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-subtle); margin: 0 0 8px; }
  .block { margin-bottom: 18px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Tabs, SegmentedControl } = window.SignalThreadDesignSystem_204ca3;
const ITEMS = [
  { key: "overview", label: "Overview", count: 12 },
  { key: "users", label: "Users", count: 42 },
  { key: "events", label: "Events", count: 8 },
];
function Demo() {
  const [a, setA] = React.useState("users");
  const [b, setB] = React.useState("overview");
  return (
    <div>
      <div className="block">
        <p className="label">Count tabs</p>
        <Tabs items={ITEMS} value={a} onChange={setA} />
      </div>
      <div>
        <p className="label">Compact segmented control</p>
        <SegmentedControl items={ITEMS} value={b} onChange={setB} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
