<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 22px; background: var(--surface-canvas); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .label { font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-subtle); margin: 0 0 8px; }
  .block { margin-bottom: 16px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Badge, RoleBadge, Alert, StatCard, Button } = window.SignalThreadDesignSystem_204ca3;
const mk = (d) => ({ size = 18, strokeWidth = 2 }) =>
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">{d}</svg>;
const Users = mk(<g><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></g>);

function Demo() {
  return (
    <div>
      <div className="block">
        <p className="label">Status badges</p>
        <div className="row">
          {["Active","Draft","In Review","Approved","Rejected","Needs setup","Blocked","Ready","Scheduled","Unknown"].map(s => <Badge key={s} status={s}>{s}</Badge>)}
        </div>
      </div>
      <div className="block">
        <p className="label">Role badges</p>
        <div className="row">
          {["SUPER_ADMIN","OWNER","ADMIN","EVENT_EDITOR","MEMBER","VIEWER"].map(r => <RoleBadge key={r} role={r} />)}
        </div>
      </div>
      <div className="cols block">
        <StatCard label="Users" value="1,248" sublabel="Provisioned app users" icon={Users} />
        <StatCard label="Review" value="5" sublabel="Need platform attention" tone="warning" icon={Users} />
      </div>
      <div className="cols">
        <Alert tone="success" title="Invite sent">Provisioning completed and memberships were queued.</Alert>
        <Alert tone="danger" title="Unable to load accounts" action={<Button variant="secondary" size="sm">Retry</Button>}>Check access or retry the request.</Alert>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
